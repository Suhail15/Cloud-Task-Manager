<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Taskboard{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="shell"><header><a class="brand" href="/">◈ Taskboard</a><span class="tag">A little structure. More progress.</span>

<main>{% block content %}{% endblock %}</main><footer>Built by Mohammed Suhail Hussain · Cloud Task Manager</footer></div></body></html>
